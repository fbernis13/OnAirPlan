<title>Carnet On Air</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout : application mobile, une colonne, barre d'onglets fixe en bas, minuteur de repos au-dessus. */
:root {
  --bg: #EDF1F0; --surface: #FFFFFF; --surface-2: #E2E8E7; --surface-3: #D3DCDB;
  --ink: #152023; --ink-2: #4D5B5F; --ink-3: #75858A; --line: #C9D3D2;
  --accent: #0B6C76; --accent-ink: #FFFFFF; --accent-soft: #CBE5E7; --accent-line: #7DB8BE;
  --amber: #A94F07; --amber-soft: #F7E1C8; --ok: #2E7A34; --ok-soft: #D6EBD7; --danger: #B42318; --danger-soft: #F8D9D5;
  --shadow: 0 1px 2px rgb(21 32 35 / .08), 0 4px 14px rgb(21 32 35 / .06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --nav-h: 3.75rem;
  --radius: .75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1315; --surface: #162023; --surface-2: #1E2A2E; --surface-3: #2A383D;
    --ink: #E5ECEC; --ink-2: #A3B3B6; --ink-3: #7A8C90; --line: #2B393D;
    --accent: #4FC4CE; --accent-ink: #052124; --accent-soft: #163B3F; --accent-line: #2F7C83;
    --amber: #F2A53E; --amber-soft: #3B2A12; --ok: #73C779; --ok-soft: #1B3320; --danger: #F27A6E; --danger-soft: #3D1C19;
    --shadow: 0 1px 2px rgb(0 0 0 / .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1315; --surface: #162023; --surface-2: #1E2A2E; --surface-3: #2A383D;
  --ink: #E5ECEC; --ink-2: #A3B3B6; --ink-3: #7A8C90; --line: #2B393D;
  --accent: #4FC4CE; --accent-ink: #052124; --accent-soft: #163B3F; --accent-line: #2F7C83;
  --amber: #F2A53E; --amber-soft: #3B2A12; --ok: #73C779; --ok-soft: #1B3320; --danger: #F27A6E; --danger-soft: #3D1C19;
  --shadow: 0 1px 2px rgb(0 0 0 / .4);
  color-scheme: dark;
}
html { font-size: var(--fs, 100%); -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── Structure */
.app { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(var(--nav-h) + 6rem + env(safe-area-inset-bottom, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; gap: .5rem; padding-block: .6rem; margin-inline: -16px; padding-inline: 16px; border-bottom: 1px solid var(--line); }
.topbar h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .01em; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-wrap: balance; }
.topbar .sub { color: var(--ink-3); font-weight: 500; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: .6rem; min-width: 2.5rem; height: 2.5rem; display: inline-grid; place-items: center; cursor: pointer; padding: 0 .5rem; }
.iconbtn svg { width: 1.25rem; height: 1.25rem; }
.sync-dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.sync-dot.cloud { background: var(--ok); } .sync-dot.pending { background: var(--amber); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { background: none; border: 0; padding: .45rem .1rem .5rem; display: grid; justify-items: center; gap: .1rem; cursor: pointer; color: var(--ink-3); font-size: .72rem; font-weight: 600; min-height: var(--nav-h); }
nav.tabs button svg { width: 1.35rem; height: 1.35rem; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs button[aria-current="page"] span { text-decoration: underline; text-underline-offset: .25em; text-decoration-thickness: 2px; }

h2 { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; line-height: 1.1; margin: 1.2rem 0 .5rem; text-wrap: balance; }
h3 { font-family: var(--f-display); font-size: 1.2rem; font-weight: 700; margin: 1rem 0 .4rem; letter-spacing: .01em; }
h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 1rem 0 .4rem; font-weight: 700; }
p { margin: .4rem 0; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: .85rem; }
.stack { display: grid; gap: .6rem; }
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .85rem; min-width: 0; }
.card.flat { box-shadow: none; }
.listbtn { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .75rem .85rem; cursor: pointer; display: flex; gap: .75rem; align-items: center; }
.listbtn:hover { border-color: var(--accent-line); }
.listbtn .grow { flex: 1; min-width: 0; }
.listbtn .t { font-weight: 600; }
.chev { color: var(--ink-3); flex: none; }

.pill { display: inline-flex; align-items: center; gap: .3rem; font-size: .75rem; font-weight: 700; padding: .12rem .5rem; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.amb { background: var(--amber-soft); color: var(--amber); }
.pill.dan { background: var(--danger-soft); color: var(--danger); }
.slot { font-family: var(--f-display); font-weight: 700; font-size: 1rem; min-width: 3.4rem; height: 2.4rem; border-radius: .5rem; display: inline-grid; place-items: center; background: var(--surface-2); color: var(--ink); flex: none; letter-spacing: .02em; }
.slot.done { background: var(--ok); color: var(--surface); }
.slot.started { background: var(--accent-soft); color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: .6rem; padding: .55rem .9rem; font-weight: 600; cursor: pointer; display: inline-flex; gap: .4rem; align-items: center; justify-content: center; min-height: 2.6rem; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.small { min-height: 2.1rem; padding: .3rem .65rem; font-size: .85rem; }
.btn svg { width: 1.1rem; height: 1.1rem; }
.btn:disabled { opacity: .5; cursor: default; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: .6rem; padding: .2rem; gap: .2rem; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: .4rem .7rem; border-radius: .45rem; cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: .5rem; padding: .45rem .55rem; min-height: 2.4rem; width: 100%; min-width: 0; }
textarea { min-height: 4.5rem; resize: vertical; }
label.fld { display: grid; gap: .2rem; font-size: .8rem; color: var(--ink-2); font-weight: 600; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
@media (max-width: 26rem) { .grid2 { grid-template-columns: 1fr; } }

/* ── Programme */
.cycle-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-top: 1.4rem; }
.cycle-head h2 { margin: 0; }
.cycle-num { font-family: var(--f-display); font-size: 2.6rem; line-height: .9; color: var(--accent); font-weight: 700; }
.progressbar { height: .35rem; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progressbar > i { display: block; height: 100%; background: var(--accent); }

.blockhead { display: flex; gap: .55rem; align-items: baseline; margin: 1.2rem 0 .45rem; flex-wrap: wrap; }
.blockhead .letter { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; color: var(--accent); line-height: 1; }
.blockhead .bt { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.exo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .8rem; display: grid; gap: .55rem; min-width: 0; }
.exo + .exo { margin-top: .5rem; }
.exo.done { border-color: var(--ok); }
.exo.skipped { opacity: .6; }
.exo-title { display: flex; gap: .5rem; align-items: flex-start; }
.exo-title .grow { flex: 1; min-width: 0; }
.exo-name { font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
.exo-en { font-size: .8rem; color: var(--ink-3); font-weight: 600; letter-spacing: .02em; }
.presc { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; white-space: nowrap; color: var(--ink); }
.prev { font-size: .8rem; color: var(--ink-2); background: var(--surface-2); padding: .25rem .5rem; border-radius: .4rem; }

.sets { display: grid; gap: .35rem; }
.set { display: grid; grid-template-columns: 1.6rem minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, .75fr) 2.6rem; gap: .35rem; align-items: end; }
.set .idx { font-family: var(--f-display); font-weight: 700; color: var(--ink-3); text-align: center; padding-bottom: .55rem; }
.set label { display: grid; gap: .1rem; font-size: .66rem; color: var(--ink-3); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; min-width: 0; }
.set input { text-align: center; padding-inline: .2rem; font-variant-numeric: tabular-nums; }
.stepper { display: grid; grid-template-columns: 2rem minmax(0,1fr) 2rem; border: 1px solid var(--line); border-radius: .5rem; overflow: hidden; background: var(--surface); min-height: 2.4rem; }
.stepper button { border: 0; background: var(--surface-2); cursor: pointer; font-weight: 700; font-size: 1.1rem; }
.stepper input { border: 0; border-radius: 0; min-height: 2.35rem; padding: 0 .1rem; text-align: center; min-width: 0; -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.checkbtn { width: 2.6rem; height: 2.4rem; border-radius: .5rem; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: var(--ink-3); }
.checkbtn svg { width: 1.3rem; height: 1.3rem; }
.set.done .checkbtn { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.set.done input { background: var(--ok-soft); }
.holdbtn { border: 0; background: var(--amber-soft); color: var(--amber); font-weight: 700; cursor: pointer; }
.holdbtn.on { background: var(--amber); color: var(--surface); }

.exo-actions { display: flex; gap: .4rem; flex-wrap: wrap; }
details.more > summary { cursor: pointer; font-size: .85rem; color: var(--ink-2); font-weight: 600; list-style: none; display: inline-flex; gap: .3rem; align-items: center; }
details.more > summary::-webkit-details-marker { display: none; }
details.more[open] > summary { margin-bottom: .5rem; }

.warm { display: grid; gap: .4rem; }
.warm .line { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .6rem .75rem; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .35rem; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: .25rem .65rem; font-size: .8rem; font-weight: 600; cursor: pointer; display: inline-flex; gap: .3rem; align-items: center; color: var(--ink); }
.chip svg { width: .9rem; height: .9rem; color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip[aria-pressed="true"] svg { color: var(--accent-ink); }

.wodcard { border-left: 4px solid var(--amber); }
.wod-items { margin: .3rem 0 .5rem; padding-left: 1.2rem; }
.wod-items li { margin: .2rem 0; }
.restline { text-align: center; color: var(--ink-3); font-weight: 600; font-size: .9rem; margin: .8rem 0; display: flex; align-items: center; gap: .6rem; }
.restline::before, .restline::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }

/* ── Minuteur de repos */
.timer { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 25; padding: .5rem 16px; background: var(--ink); color: var(--bg); display: flex; align-items: center; gap: .6rem; }
.timer .big { font-family: var(--f-display); font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4.6rem; line-height: 1; }
.timer .lbl { font-size: .78rem; opacity: .8; line-height: 1.2; min-width: 0; flex: 1; }
.timer button { background: transparent; color: var(--bg); border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); border-radius: .5rem; min-width: 2.5rem; height: 2.5rem; cursor: pointer; display: grid; place-items: center; font-weight: 700; font-size: .85rem; padding: 0 .4rem; }
.timer button svg { width: 1.2rem; height: 1.2rem; }
.timer.finished { background: var(--amber); color: #1c1205; }
.timer.finished button { color: #1c1205; border-color: rgb(28 18 5 / .4); }
.timer .bar { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); }

/* ── Vidéos */
.vids { display: grid; gap: .5rem; }
.vid { display: grid; grid-template-columns: 7.5rem minmax(0,1fr); gap: .65rem; align-items: start; background: var(--surface-2); border-radius: .6rem; padding: .5rem; }
.vid .thumb { position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; border-radius: .4rem; overflow: hidden; background: linear-gradient(135deg, var(--accent-soft), var(--surface-3)); display: grid; place-items: center; border: 0; padding: 0; cursor: pointer; }
.vid .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vid .thumb svg { position: relative; width: 2rem; height: 2rem; color: var(--accent); filter: drop-shadow(0 1px 2px rgb(0 0 0 / .3)); }
.vid .vt { font-weight: 600; font-size: .88rem; line-height: 1.25; overflow-wrap: anywhere; }
.vid .va { font-size: .76rem; color: var(--ink-3); }
.vid .links { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .3rem; font-size: .82rem; font-weight: 600; }
.vid .embed { grid-column: 1 / -1; aspect-ratio: 16/9; max-width: 100%; }
.vid .embed iframe { width: 100%; height: 100%; border: 0; border-radius: .4rem; }
.novid { font-size: .85rem; color: var(--ink-3); background: var(--surface-2); border-radius: .6rem; padding: .5rem .65rem; }
.variant { font-size: .8rem; color: var(--amber); font-weight: 600; }

/* ── Sheets / modales */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 46rem; max-height: 88%; overflow-y: auto; border-radius: 1rem 1rem 0 0; padding: 1rem 16px calc(1.2rem + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { margin-top: 0; }

/* ── Muscles */
.bodywrap { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.bodywrap figure { margin: 0; text-align: center; }
.bodywrap figcaption { font-size: .75rem; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
svg.body { width: 100%; max-width: 13rem; height: auto; }
svg.body .base { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; }
svg.body .m { cursor: pointer; stroke-width: 1.4; transition: opacity .15s; }
svg.body .m-0 { fill: var(--surface-3); stroke: var(--line); }
svg.body .m-p { fill: var(--accent); stroke: var(--accent); }
svg.body .m-s { fill: var(--accent-soft); stroke: var(--accent-line); }
svg.body .m-t { fill: url(#hatch); stroke: var(--amber); }
svg.body .m-w { fill: var(--surface-3); stroke: var(--ink-2); stroke-dasharray: 3 2.5; }
svg.body .m.dim { opacity: .18; }
svg.body .m.sel { stroke: var(--ink); stroke-width: 2.4; }
.legend { display: flex; flex-wrap: wrap; gap: .4rem .9rem; font-size: .8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: .9rem; height: .9rem; border-radius: .2rem; vertical-align: -.15rem; margin-right: .3rem; border: 1.4px solid transparent; }
.legend .lp { background: var(--accent); border-color: var(--accent); }
.legend .ls { background: var(--accent-soft); border-color: var(--accent-line); }
.legend .lt { background: repeating-linear-gradient(45deg, var(--amber) 0 2px, var(--amber-soft) 2px 5px); border-color: var(--amber); }
.legend .lw { background: var(--surface-3); border: 1.4px dashed var(--ink-2); }
.legend .l0 { background: var(--surface-3); border-color: var(--line); }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; font-size: .88rem; }
table.tbl th, table.tbl td { padding: .5rem .55rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.tbl th { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 700; background: var(--surface-2); }
table.tbl td.n, table.tbl th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl tr.clickable { cursor: pointer; }
table.tbl tr.clickable:hover td { background: var(--surface-2); }
table.tbl tr.selrow td { background: var(--accent-soft); }
.origins { font-size: .8rem; color: var(--ink-2); }

/* ── Fiches */
.kv { display: grid; grid-template-columns: minmax(6.5rem, auto) minmax(0, 1fr); gap: .35rem .8rem; font-size: .9rem; }
.kv dt { color: var(--ink-3); font-weight: 600; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
ul.clean { margin: .2rem 0; padding-left: 1.1rem; }
ul.clean li { margin: .2rem 0; }
.absent { color: var(--ink-3); font-style: italic; }
.prefsel { display: flex; flex-wrap: wrap; gap: .35rem; }

.spark { width: 100%; height: 2.6rem; }
.spark path.l { fill: none; stroke: var(--accent); stroke-width: 2; }
.spark path.a { fill: var(--accent-soft); stroke: none; }
.spark circle { fill: var(--accent); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 4.5rem + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: .55rem .9rem; border-radius: .6rem; font-size: .9rem; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); }
.callout { border-radius: var(--radius); padding: .7rem .8rem; background: var(--amber-soft); color: var(--ink); font-size: .9rem; }
.callout strong { color: var(--amber); }
.empty { text-align: center; color: var(--ink-3); padding: 1.5rem .5rem; }
.dict { display: grid; gap: .5rem; }
.rec { display: inline-flex; gap: .4rem; align-items: center; color: var(--danger); font-weight: 700; font-size: .85rem; }
.rec::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: var(--danger); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }

/* ── Programme : rail des cycles à gauche */
.prog-layout { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: .75rem; margin-top: 1rem; align-items: start; }
.cycle-rail { display: grid; gap: .4rem; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 4rem); }
.cycle-rail button { border: 1px solid var(--line); background: var(--surface); border-radius: .6rem; padding: .5rem .35rem; cursor: pointer; display: grid; gap: .05rem; text-align: center; }
.cycle-rail .cn { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
.cycle-rail .cl { font-size: .68rem; color: var(--ink-3); font-weight: 600; overflow-wrap: anywhere; line-height: 1.15; }
.cycle-rail .cd { font-size: .72rem; color: var(--ink-2); font-weight: 700; }
.cycle-rail button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cycle-rail button[aria-pressed="true"] .cl, .cycle-rail button[aria-pressed="true"] .cd { color: var(--accent-ink); }
.sessbtn .slot { min-width: 2.4rem; }

/* ── Séance : menu des exercices à gauche */
.sess-layout { display: grid; grid-template-columns: 3.3rem minmax(0, 1fr); gap: .6rem; align-items: start; }
.sess-main { min-width: 0; }

/* Carnet On Air : état, stockage local, synchronisation, utilitaires. */
const LS_KEY = 'carnet-onair-v1';
const PREF_LABELS = { keep: 'Conserver', aside: 'Mettre de côté', practice: 'À travailler', warmup: 'Mise en route', alternative: 'Chercher une alternative' };
const PREF_ORDER = ['keep', 'aside', 'practice', 'warmup', 'alternative'];

function blankState() {
  return { v: 1, settings: { theme: 'system', size: 100, sound: true }, prefs: {}, machines: {}, bench: {}, logs: {}, metaAt: 0, savedAt: 0 };
}
let S = blankState();
const UI = { tab: 'programme', session: null, exo: null, move: null, musScope: 'prog', musSession: 'c1-r1', musAdj: true, musSel: null, exFilter: '', mvFilter: '', mvPref: 'all', mvCat: 'all', sheet: null, sync: 'local', toast: null };

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.v === 1) S = Object.assign(blankState(), d); }
  } catch (e) { /* stockage indisponible : on continue en mémoire */ }
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
}

/* ── Synchronisation avec le compte (capability db, sous-arbre privé data/users/<id>) */
const Cloud = { db: null, col: null, dirty: new Set(), timer: null, busy: false };
function touchMeta() { S.metaAt = Date.now(); markDirty('meta'); }
function touchLog(id) { const L = S.logs[id]; if (L) L.updatedAt = Date.now(); markDirty('log-' + id); }
function markDirty(docId) {
  if (!docId.startsWith('snap-')) S.savedAt = Date.now();
  saveLocal();
  if (typeof serverDirty === 'function') serverDirty(docId);
  Cloud.dirty.add(docId);
  if (Cloud.col) { setSync('pending'); clearTimeout(Cloud.timer); Cloud.timer = setTimeout(flushCloud, 1500); }
}
function docBody(docId) {
  if (docId === 'meta') return { kind: 'meta', settings: S.settings, prefs: S.prefs, machines: S.machines, bench: S.bench, updatedAt: S.metaAt || Date.now() };
  if (docId.startsWith('snap-')) { const x = SNAPS.find(z => 'snap-' + z.id === docId); return x ? { kind: 'snap', id: x.id, at: x.at, label: x.label, progression: x.progression, updatedAt: x.at } : null; }
  const id = docId.slice(4); const L = S.logs[id];
  return L ? { kind: 'log', session: id, log: L, updatedAt: L.updatedAt || Date.now() } : null;
}
async function flushCloud() {
  if (!Cloud.col || Cloud.busy) return;
  Cloud.busy = true;
  try {
    while (Cloud.dirty.size) {
      const docId = Cloud.dirty.values().next().value; Cloud.dirty.delete(docId);
      const body = docBody(docId);
      try {
        if (body) await Cloud.col.doc(docId).set(JSON.parse(JSON.stringify(body)));
        else await Cloud.col.doc(docId).delete();

  PAIR_OF = {}; MACHINE_PAIRS.forEach(p => { if (!PAIR_OF[p.guidee]) PAIR_OF[p.guidee] = p; if (!PAIR_OF[p.hammer]) PAIR_OF[p.hammer] = p; });

async function refreshDataFiles() {

  return changed;
}

/* ── Les trois documents tels qu'on les exporte */
function docBibliotheque() {
  const b = JSON.parse(JSON.stringify(BIB));
  /* les préférences de mouvements restent dans la progression ; on les recopie dans le catalogue exporté */
  (b.catalogue && b.catalogue.movements || []).forEach(m => { if (S.prefs[m.id]) m.selection = S.prefs[m.id]; });
  b.exportedAt = new Date().toISOString();
  return b;
}
function docCarnet() { return Object.assign(JSON.parse(JSON.stringify(CAR)), { exportedAt: new Date().toISOString() }); }
function docProgression(st) {
  st = st || S;
  return { fileType: 'onair.progression', version: 1, exportedAt: new Date().toISOString(), carnet: CAR && CAR.title,
    settings: st.settings, prefs: st.prefs, machines: st.machines || {}, bench: st.bench, logs: st.logs };
}
function progressionToState(d) {
  /* accepte aussi l'ancien export { fileType: 'onair.carnet', data: { v: 1, … } } */
  const src = d && d.fileType === 'onair.progression' ? d : d && d.data && d.data.v === 1 ? d.data : null;
  if (!src) return null;
  const st = blankState();
  st.settings = Object.assign(st.settings, src.settings || {});
  st.prefs = src.prefs || {}; st.machines = src.machines || {}; st.bench = src.bench || {}; st.logs = src.logs || {};
  return st;
}
function isLegacyProgression(d) { return d && d.fileType === 'onair.carnet' && d.data && d.data.v === 1; }

/* Remplace la progression et la pousse vers le compte */
function replaceProgression(st) {
  const old = Object.keys(S.logs);
  S = st; const now = Date.now(); S.metaAt = now;
  Object.values(S.logs).forEach(L => { L.updatedAt = now; });
  markDirty('meta');
  new Set(old.concat(Object.keys(S.logs))).forEach(id => markDirty('log-' + id));
  applySettings();
}
/* Bibliothèque ou carnet importé : gardé sur l'appareil, et sur le serveur en version site */
function writeDoc(kind, doc) { const ok = writeLS(DATA_LS[kind], doc); if (typeof serverDocDirty === 'function') serverDocDirty(kind); return ok; }
function setOverride(kind, doc) {
  const ok = writeDoc(kind, doc);
  pickData();
  return ok;
}

/* ── Sauvegardes (points de restauration) : sur l'appareil, et dans le compte pour la progression */
let SNAPS = readLS(DATA_LS.snaps) || [];
const SNAP_MAX = 12;
function storeSnaps() {
  SNAPS.sort((a, b) => b.at - a.at);
  while (SNAPS.length > SNAP_MAX) { const x = SNAPS.pop(); markDirty('snap-' + x.id); }
  if (!writeLS(DATA_LS.snaps, SNAPS)) {
    /* stockage plein : on retire d'abord les copies de bibliothèque/carnet des plus anciennes */
    for (let i = SNAPS.length - 1; i >= 0 && !writeLS(DATA_LS.snaps, SNAPS); i--) { delete SNAPS[i].bib; delete SNAPS[i].car; }
  }
}
function makeSnapshot(label) {
  const snap = { id: Date.now().toString(36), at: Date.now(), label: label || 'Sauvegarde manuelle', progression: docProgression() };
  if (readLS(DATA_LS.bib)) snap.bib = BIB;
  if (readLS(DATA_LS.car)) snap.car = CAR;
  SNAPS.unshift(snap); storeSnaps(); markDirty('snap-' + snap.id);
  return snap;
}
function restoreSnapshot(id) {
  const snap = SNAPS.find(x => x.id === id); if (!snap) return false;
  makeSnapshot('Avant restauration du ' + new Date(snap.at).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }));
  writeDoc('bib', snap.bib || null); writeDoc('car', snap.car || null); pickData();
  const st = progressionToState(snap.progression); if (st) replaceProgression(st);
  return true;
}
function deleteSnapshot(id) { SNAPS = SNAPS.filter(x => x.id !== id); storeSnaps(); markDirty('snap-' + id); }

/* ── Remise à zéro : chaque cible est d'abord sauvegardée, la restauration reste possible */
function resetData(what) {
  makeSnapshot('Avant remise à zéro (' + ({ progression: 'progression', bib: 'bibliothèque', car: 'carnet', all: 'tout' })[what] + ')');
  if (what === 'bib' || what === 'all') writeDoc('bib', null);
  if (what === 'car' || what === 'all') writeDoc('car', null);
  pickData();
  if (what === 'progression' || what === 'all') { const keep = S.settings; const st = blankState(); st.settings = keep; replaceProgression(st); }
}

/* Carnet On Air : enregistrement sur le serveur Supabase (version site).
   Actif seulement si config/supabase.json est rempli et la bibliothèque supabase-js chargée.
   - progression : une ligne par compte (table progression), dernière écriture gagnante ;
   - bibliothèque et carnet partagés : table documents, modifiables par un administrateur ;
   - sauvegardes : table sauvegardes, une ligne par point de restauration.
   Une copie reste dans le navigateur pour fonctionner sans réseau à la salle ;
   les modifications faites hors ligne partent au retour du réseau. */
const Server = { on: false, client: null, user: null, timer: null, busy: false, prog: false, docs: {}, snaps: new Set() };
const SERVER_LS = 'onair-server-user';
const serverConfigured = () => typeof SUPA_CONFIG !== 'undefined' && !!(SUPA_CONFIG && SUPA_CONFIG.url && SUPA_CONFIG.anonKey);
const DOC_KIND = { bib: 'bibliotheque', car: 'carnet' };

function serverClient() {
  if (Server.client) return Server.client;
  if (!serverConfigured() || !window.supabase || typeof window.supabase.createClient !== 'function') return null;
  Server.client = window.supabase.createClient(SUPA_CONFIG.url, SUPA_CONFIG.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  return Server.client;
}
function loginToEmail(login) {
  const l = String(login || '').trim();
  if (l.includes('@')) return l.toLowerCase();
  const map = (SUPA_CONFIG && SUPA_CONFIG.logins) || {};
  return map[l.toLowerCase()] || null;
}
async function serverRole(c, uid) {
  const last = readLS(SERVER_LS); const known = last && last.id === uid ? last.role : 'membre';
  try { const { data, error } = await c.from('roles').select('role').eq('user_id', uid).maybeSingle(); return error ? known : (data && data.role) || 'membre'; }
  catch (e) { return known; }
}
function loginOf(email) {
  const map = (SUPA_CONFIG && SUPA_CONFIG.logins) || {};
  return Object.keys(map).find(k => map[k] === email) || email;
}
function rememberServerUser(u) { writeLS(SERVER_LS, u); }

/* Appelé par startApp une fois le carnet affiché : récupère le serveur et fusionne */
async function initServer() {
  const c = Server.client; if (!c || !Server.user) return;
  Server.on = true; setSync('pending');
  try {
    const docs = await c.from('documents').select('kind,data');
    if (docs.error) throw docs.error;
    const got = {}; (docs.data || []).forEach(d => { got[d.kind] = d.data; });
    const b = got.bibliotheque && !checkBib(got.bibliotheque) ? got.bibliotheque : null;
    const k = got.carnet && !checkCar(got.carnet, b || DATA.base.bib) ? got.carnet : null;
    /* un document modifié hors ligne par un administrateur garde la priorité jusqu'à son envoi */
    if (!('bib' in Server.docs)) writeLS(DATA_LS.bib, b);
    if (!('car' in Server.docs)) writeLS(DATA_LS.car, k);
    pickData();

    const row = await c.from('progression').select('data,updated_at').eq('user_id', Server.user.id).maybeSingle();
    if (row.error) throw row.error;
    const remoteAt = row.data ? Date.parse(row.data.updated_at) : 0;
    if (row.data && remoteAt > (S.savedAt || 0)) {
      const st = progressionToState(row.data.data);
      if (st) { st.savedAt = remoteAt; S = st; saveLocal(); applySettings(); pickData(); }
    } else if (S.savedAt) Server.prog = true;

    const sn = await c.from('sauvegardes').select('id,created_at,label,data').order('created_at', { ascending: false }).limit(SNAP_MAX);
    if (sn.error) throw sn.error;
    const remote = new Set();
    (sn.data || []).forEach(r => {
      remote.add(r.id);
      if (!SNAPS.some(x => x.id === r.id)) SNAPS.push(Object.assign({ id: r.id, at: Date.parse(r.created_at), label: r.label }, r.data || {}));
    });
    SNAPS.forEach(x => { if (!remote.has(x.id)) Server.snaps.add(x.id); });
    storeSnaps();
    render();
    await flushServer();
  } catch (e) {
    setSync('local');
    showToast('Serveur injoignable : tes notes restent sur cet appareil et partiront à la prochaine connexion.');
  }
}

function serverDirty(docId) {
  if (!Server.on) return;
  if (docId.startsWith('snap-')) Server.snaps.add(docId.slice(5)); else Server.prog = true;
  scheduleServer();
}
function serverDocDirty(kind) { if (!Server.on) return; Server.docs[kind] = true; scheduleServer(); }
function scheduleServer(delay) { setSync('pending'); clearTimeout(Server.timer); Server.timer = setTimeout(flushServer, delay || 1200); }

async function flushServer() {
  const c = Server.client; if (!Server.on || !c || Server.busy) return;
  Server.busy = true;
  try {
    for (const kind of Object.keys(Server.docs)) {
      const doc = readLS(DATA_LS[kind]);
      const r = doc ? await c.from('documents').upsert({ kind: DOC_KIND[kind], data: doc, updated_at: new Date().toISOString() })
        : await c.from('documents').delete().eq('kind', DOC_KIND[kind]);
      if (r.error) throw r.error;
      delete Server.docs[kind];
    }
    if (Server.prog) {
      Server.prog = false;
      const r = await c.from('progression').upsert({ user_id: Server.user.id, data: docProgression(), updated_at: new Date(S.savedAt || Date.now()).toISOString() });
      if (r.error) { Server.prog = true; throw r.error; }
    }
    for (const id of [...Server.snaps]) {
      const x = SNAPS.find(z => z.id === id);
      const r = x ? await c.from('sauvegardes').upsert({ id: x.id, user_id: Server.user.id, created_at: new Date(x.at).toISOString(), label: x.label, data: { progression: x.progression, bib: x.bib, car: x.car } })
        : await c.from('sauvegardes').delete().eq('user_id', Server.user.id).eq('id', id);
      if (r.error) throw r.error;
      Server.snaps.delete(id);
    }
    setSync('cloud');
  } catch (e) {
    if (e && (e.code === '42501' || e.status === 401 || e.status === 403)) {
      Server.docs = {}; setSync('local');
      showToast('Le serveur a refusé l’enregistrement (droits insuffisants).');
    } else { setSync('pending'); clearTimeout(Server.timer); Server.timer = setTimeout(flushServer, 8000); }
  } finally { Server.busy = false; }
}
window.addEventListener('online', () => { if (Server.on) scheduleServer(300); });

/* Carnet On Air : connexion simple pour la version publiée sur un site.
   Les comptes viennent de auth/utilisateurs.json, intégré à la construction (AUTH_USERS) :
   mot de passe en PBKDF2-SHA256, jamais en clair. Une connexion réussie pose un cookie de
   session (effacé à la fermeture du navigateur). C'est un contrôle côté navigateur : il
   filtre l'accès à l'écran mais ne protège pas les fichiers publiés avec la page. */
const AUTH = { user: null, cookie: 'onair_session' };
const authEnabled = () => serverConfigured() || (typeof AUTH_USERS !== 'undefined' && AUTH_USERS && Array.isArray(AUTH_USERS.users));
const userName = () => { const l = (AUTH.user && AUTH.user.login) || ''; const n = l.includes('@') ? l.split('@')[0] : l; return n.charAt(0).toUpperCase() + n.slice(1); };
const isAdmin = () => !authEnabled() || (AUTH.user && AUTH.user.role === 'admin');

function readSessionCookie() {
  const m = document.cookie.split('; ').find(c => c.startsWith(AUTH.cookie + '='));
  if (!m) return null;
  try { return JSON.parse(decodeURIComponent(m.slice(AUTH.cookie.length + 1))); } catch (e) { return null; }
}
function writeSessionCookie(v) {
  const secure = location.protocol === 'https:' ? '; Secure' : '';
  document.cookie = v ? `${AUTH.cookie}=${encodeURIComponent(JSON.stringify(v))}; Path=/; SameSite=Strict${secure}`
    : `${AUTH.cookie}=; Path=/; Max-Age=0; SameSite=Strict${secure}`;
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function checkPassword(u, pw) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(u.salt), iterations: u.iterations }, key, 256);
  const a = b64(bits), b = u.hash; let diff = a.length ^ b.length;
  for (let i = 0; i < Math.min(a.length, b.length); i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}
function viewLogin(msg) {
  document.getElementById('app').innerHTML = `<div class="login"><form class="card stack" id="login-form" autocomplete="on">
    <h1 style="margin:0">Carnet On Air</h1>
    <p class="small muted" style="margin:0">Connecte-toi pour ouvrir ton carnet.</p>
    <label class="fld">Identifiant<input id="login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="fld">Mot de passe<input id="login-pw" name="password" type="password" autocomplete="current-password" required></label>
    ${msg ? `<p class="small" style="margin:0;color:var(--danger)" role="alert">${esc(msg)}</p>` : ''}
    <button class="btn primary" type="submit" id="login-go">Se connecter</button>
  </form></div>`;
  document.getElementById('login-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const login = document.getElementById('login-user').value.trim().toLowerCase(), pw = document.getElementById('login-pw').value;
    const btn = document.getElementById('login-go'); btn.disabled = true; btn.textContent = 'Vérification…';
    if (serverConfigured()) {
      const c = serverClient(); if (!c) return viewLogin('Le serveur ne répond pas. Vérifie ta connexion internet.');
      const email = loginToEmail(login); if (!email) { await new Promise(r => setTimeout(r, 600)); return viewLogin('Identifiant ou mot de passe incorrect.'); }
      const { data, error } = await c.auth.signInWithPassword({ email, password: pw });
      if (error || !data || !data.user) {
        const m = (error && (error.code || error.message)) || '';
        return viewLogin(/fetch|network/i.test(m) ? 'Le serveur ne répond pas. Vérifie ta connexion internet.'
          : /not_confirmed|not confirmed/i.test(m) ? 'Ce compte n’est pas encore confirmé dans Supabase (Authentication > Users).'
          : 'Identifiant ou mot de passe incorrect.');
      }
      return serverSignedIn(c, data.user);
    }
    const u = AUTH_USERS.users.find(x => x.login.toLowerCase() === login);
    let ok = false;
    try { ok = !!u && await checkPassword(u, pw); } catch (e) { return viewLogin('La vérification est impossible dans ce navigateur (page non sécurisée).'); }
    if (!ok) { await new Promise(r => setTimeout(r, 600)); return viewLogin('Identifiant ou mot de passe incorrect.'); }
    AUTH.user = { login: u.login, role: u.role }; writeSessionCookie({ u: u.login, t: b64(crypto.getRandomValues(new Uint8Array(16))) });
    startApp();
  });
  setTimeout(() => { const f = document.getElementById('login-user'); if (f) f.focus(); }, 0);
}
async function serverSignedIn(c, user) {
  const role = await serverRole(c, user.id);
  /* autre compte que le dernier connecté sur cet appareil : on efface ses notes locales
     pour qu'elles ne partent jamais dans la progression du nouveau compte */
  const last = readLS(SERVER_LS);
  if (last && last.id !== user.id) {
    [LS_KEY, DATA_LS.snaps].forEach(k => writeLS(k, null));
    rememberServerUser({ id: user.id, email: user.email, login: loginOf(user.email), role });
    return location.reload();
  }
  Server.user = { id: user.id, email: user.email };
  AUTH.user = { login: loginOf(user.email), role, server: true };
  rememberServerUser({ id: user.id, email: user.email, login: AUTH.user.login, role });
  startApp();
}
async function logout() {
  if (Server.client) {
    try { await flushServer(); await Server.client.auth.signOut(); } catch (e) {}
    /* les données vivent sur le serveur : on ne laisse pas de copie sur un appareil après déconnexion */
    [LS_KEY, DATA_LS.bib, DATA_LS.car, DATA_LS.snaps, SERVER_LS].forEach(k => writeLS(k, null));
  }
  writeSessionCookie(null); AUTH.user = null; location.reload();
}
/* Point d'entrée : ouvre le carnet directement, ou l'écran de connexion */
async function authGate() {
  if (!authEnabled()) return startApp();
  if (serverConfigured()) {
    const c = serverClient();
    if (!c) {
      /* bibliothèque Supabase non chargée (pas de réseau) : on rouvre le dernier compte connecté sur ses données locales */
      const last = readLS(SERVER_LS);
      if (last) { AUTH.user = { login: last.login, role: last.role, server: true }; startApp(); showToast('Hors ligne : tes notes seront envoyées au serveur au retour du réseau (recharge la page).'); return; }
      return viewLogin('Le serveur ne répond pas. Vérifie ta connexion internet.');
    }
    let session = null;
    try { session = (await c.auth.getSession()).data.session; } catch (e) { session = null; }
    if (session && session.user) return serverSignedIn(c, session.user);
    return viewLogin();
  }
  const c = readSessionCookie(); const u = c && AUTH_USERS.users.find(x => x.login === c.u);
  if (u) { AUTH.user = { login: u.login, role: u.role }; return startApp(); }
  viewLogin();
}

/* Carnet On Air : écrans Programme et Séance, vidéos, minuteurs, dictée, réglages. */

/* ── Vidéos
   L'aperçu tente de charger la miniature YouTube. Si l'hébergement la bloque (cas des Artifacts),
   une vignette neutre s'affiche et seul le lien externe est proposé. Si la miniature se charge,
   la lecture intégrée à la demande est proposée. */
let EMBED_OK = null; // null = inconnu, true = miniatures chargées (lecture intégrée tentée), false = bloquées
function videosFor(k) {
  const d = exDef(k); const list = [];
  if (d.mv && MOVE_BY_ID[d.mv]) (MOVE_BY_ID[d.mv].media || []).forEach(m => list.push(Object.assign({ origin: 'catalogue', checkedAt: m.metadataCheckedAt, ficheSource: m.sourceUrl, variantNote: MOVE_BY_ID[d.mv].editorialNote }, m)));
  (d.vid || []).forEach(v => { if (VIDEOS[v]) list.push(Object.assign({ origin: 'recherche' }, VIDEOS[v])); });
  const seen = new Set(); return list.filter(v => !seen.has(v.videoId) && seen.add(v.videoId));
}
function videoCard(v, uid) {
  const showEmbed = UI.playing === uid;
  return `<div class="vid">
    <button class="thumb" data-act="play" data-uid="${esc(uid)}" aria-label="Voir la vidéo ${esc(v.title)}">

      <div class="vt">${esc(v.title)}</div>

      <div class="links">
        ${EMBED_OK === true ? `<button class="btn small ghost" data-act="play" data-uid="${esc(uid)}">${showEmbed ? 'Fermer' : 'Lire ici'}</button>` : ''}
        <a href="${esc(v.url)}" target="_blank" rel="noopener">YouTube ${IC.ext}</a>
        ${v.ficheSource && v.ficheSource !== v.url ? `<a href="${esc(v.ficheSource)}" target="_blank" rel="noopener">Page source ${IC.ext}</a>` : ''}
      </div>
    </div>
    ${showEmbed && EMBED_OK === true ? `<div class="embed"><iframe src="https://www.youtube-nocookie.com/embed/${esc(v.videoId)}?autoplay=1&rel=0" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>` : ''}
  </div>`;
}
window.thumbOk = () => { if (EMBED_OK !== true) { EMBED_OK = true; scheduleRender(); } };
window.thumbFail = img => { img.remove(); if (EMBED_OK === null) EMBED_OK = false; };
function videoBlock(k, ctx) {

/* ── Écran Programme */
function viewProgramme() {
  const doneCount = SESSIONS.filter(s => sessionStatus(s.id) === 'done').length;
  const next = SESSIONS.find(s => sessionStatus(s.id) !== 'done');
  let h = `<div class="card" style="margin-top:1rem">
    <div class="row"><div class="grow"><div class="faint small" style="font-weight:700;text-transform:uppercase;letter-spacing:.08em">${esc(PROGRAMS[programId()].label)} · Salle On Air</div>
    <div style="font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.15"><span class="num">${doneCount}</span> / 20 séances terminées</div></div></div>

  </div>
  ${MACHINE_PAIRS.length ? (() => { const used = MACHINE_PAIRS.filter(p => S.machines[p.id]); const all = v => MACHINE_PAIRS.every(p => S.machines[p.id] === v);
    const H = MACHINE_PAIRS.filter(p => p.haltero); const allH = H.length && H.every(p => S.machines[p.id] === 'haltero') && used.length === H.length;
    const cur = !used.length ? 'plan' : all('hammer') ? 'hammer' : all('guidee') ? 'guidee' : allH ? 'haltero' : 'mix';
    return `<div class="card stack" style="margin-top:.8rem"><div class="row"><strong class="grow">Machines</strong>${cur === 'mix' ? '<span class="pill">choix par exercice</span>' : ''}</div>
      <div class="seg" role="group" aria-label="Machines pour tout le programme">${[['plan', 'Comme prévu'], ['guidee', 'Tout guidé'], ['hammer', 'Tout Hammer']].concat(H.length ? [['haltero', 'Haltéro']] : []).map(([v, l]) => `<button data-act="machine-all" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div>
      <p class="small muted" style="margin:0">S’applique à ${MACHINE_PAIRS.length} machines.${H.length ? ` Haltéro remplace ${H.length} d’entre elles par un mouvement du catalogue à partir du cycle ${Math.min(...H.map(p => p.halteroFrom || 1))} ; avant, la machine prévue reste.` : ''} Tu peux aussi choisir exercice par exercice dans la séance. Le choix est enregistré avec ta progression.</p></div>`; })() : ''}
  <details class="more" style="margin-top:.8rem"><summary>${IC.chev} Principes et signaux d’arrêt</summary>
    <div class="card stack small">${PROGRAM_RULES.map(r => `<p style="margin:0">${esc(r)}</p>`).join('')}</div></details>`;

const REST = { total: 0, left: 0, running: false, label: '', endAt: 0, tick: null, finished: false };
function startRest(sec, label) {
  if (!sec) return;
  REST.total = sec; REST.left = sec; REST.label = label; REST.finished = false; REST.running = true; REST.endAt = Date.now() + sec * 1000;
  runRest(); renderTimer();
}
function runRest() {
  clearInterval(REST.tick);
  REST.tick = setInterval(() => {
    if (!REST.running) return;
    REST.left = Math.max(0, (REST.endAt - Date.now()) / 1000);
    if (REST.left <= 0) { REST.running = false; REST.finished = true; clearInterval(REST.tick); beep(3); }
    renderTimer();
  }, 250);
}
function renderTimer() {
  let el = document.getElementById('timer');
  if (!REST.total) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'timer'; el.setAttribute('role', 'timer'); document.body.appendChild(el); }

const HOLD = { uid: null, start: 0, base: 0, tick: null, target: 0, beeped: false, ref: null, elapsed() { return this.base + (Date.now() - this.start) / 1000; } };
function toggleHold(ref) {
  const id = `${ref.sid}-${ref.key}-${ref.si}`;
  if (HOLD.uid === id) { // arrêt
    const v = Math.floor(HOLD.elapsed()); clearInterval(HOLD.tick); HOLD.uid = null;
    writeSet(ref, 'dur', v); return v;
  }
  if (HOLD.uid) toggleHold(HOLD.ref);
  HOLD.uid = id; HOLD.ref = ref; HOLD.start = Date.now(); HOLD.base = 0; HOLD.beeped = false; HOLD.target = Number(ref.target) || 0;
  HOLD.tick = setInterval(() => {
    const inp = document.getElementById('s-dur-' + id); const v = Math.floor(HOLD.elapsed());
    if (inp) inp.value = v;
    if (HOLD.target && !HOLD.beeped && v >= HOLD.target) { HOLD.beeped = true; beep(2); }
  }, 200);
  return null;
}

const DICT = { target: null, rec: null, listening: false, text: '', error: '' };

  try {

    let finalTxt = '';

      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) { const t = ev.results[i][0].transcript; if (ev.results[i].isFinal) finalTxt += t + ' '; else interim += t; }

/* Règle de calcul (conservée volontairement séparée) :
   1. Séries de renforcement où le groupe est moteur principal.
   2. Séries de sollicitation secondaire, assistance ou stabilisation.
   3. Travail technique (cleans), compté à part.
   4. Présence dans les séances cardio (nombre de séances, pas de séries).
   5. Présence dans les WODs (nombre de séances, sans inventer de séries).
   La mise en route et le retour au calme ne sont pas comptés. */
function computeMuscles(sids, adjusted) {
  const R = {};
  Object.keys(MUSCLES).forEach(g => R[g] = { p: 0, s: 0, hold: 0, tech: 0, wod: new Set(), cardio: new Set(), oP: {}, oS: {}, oT: {}, oW: {}, oC: {} });
  const add = (o, k, n) => { o[k] = (o[k] || 0) + n; };
  sids.forEach(sid => {
    const s = SESSION_BY_ID[sid]; const L = adjusted ? S.logs[sid] : null;
    s.blocks.forEach(bl => {
      if (bl.type === 'rest') return;
      (bl.items || []).forEach((it, i) => {
        const E = L && L.ex ? L.ex[itemKey(bl, i)] : null;
        if (adjusted && E && E.skipped) return;
        const eff = adjusted ? plannedEx(it, E, s.cycle) : machineEx(it.x, s.cycle); const d = exDef(eff);
        const lbl = eff !== it.x ? d.fr : itemLabel(it);
        const groups = [...new Set([...(d.p || []), ...(d.s || [])])];
        if (bl.type === 'wod') { groups.forEach(g => { R[g].wod.add(sid); add(R[g].oW, lbl, 1); }); return; }
        if (s.slot === 'CA' || d.kind === 'cardio') { groups.forEach(g => { R[g].cardio.add(sid); add(R[g].oC, lbl, 1); }); return; }
        const n = adjusted && E ? (E.sets || []).length : (it.sets || 0);
        if (d.kind === 'tech') { (d.p || []).forEach(g => { R[g].tech += n; add(R[g].oT, lbl, n); }); return; }
        (d.p || []).forEach(g => { R[g].p += n; if (d.unit === 'time') R[g].hold += n; add(R[g].oP, lbl + (d.unit === 'time' ? ' (maintien)' : ''), n); });
        (d.s || []).forEach(g => { R[g].s += n; add(R[g].oS, lbl, n); });
      });
    });
  });
  return R;
}
function muscleClass(r) {
  if (r.p) return 'm-p'; if (r.s) return 'm-s'; if (r.tech) return 'm-t'; if (r.wod.size || r.cardio.size) return 'm-w'; return 'm-0';
}

  if (UI.musScope === 'prog') return SESSIONS.map(s => s.id);
  if (UI.musScope === 'sess') return [UI.musSession];
  const c = Number(UI.musScope.slice(1)); return SESSIONS.filter(s => s.cycle === c).map(s => s.id);
}

/* ── Progression */
function benchAuto(id) {
  const g = (sid, bl) => (((S.logs[sid] || {}).wod || {})[bl] || {}).score || '';
  const setRes = (sid, key) => { const e = ((S.logs[sid] || {}).ex || {})[key]; return e && e.sets && e.sets[0] ? (e.sets[0].res || '') : ''; };
  if (id === 'amrap12') return { c1: g('c1-wod', 'B'), c4: g('c4-wod', 'B') };
  if (id === 'row2k') return { c1: '', c4: setRes('c4-ca', 'B0') };
  return { c1: '', c4: '' };
}
/* Objectifs suivis sur tout le programme : résultat du test de chaque cycle (première série notée) */
function objectiveResults(o) {
  return CYCLES.map(c => {
    let v = '';
    SESSIONS.filter(s => s.cycle === c.n).forEach(s => s.blocks.forEach(bl => (bl.items || []).forEach((it, i) => {
      if (it.test !== o.id || v !== '') return;
      const e = ((S.logs[s.id] || {}).ex || {})[itemKey(bl, i)]; const st = e && e.sets && e.sets[0];
      if (st && st.reps !== '' && st.reps != null && (st.done || e.done)) v = Number(st.reps);
    })));
    return { n: c.n, v };
  });
}
function viewObjectives() {
  if (!OBJECTIVES.length) return '';
  return `<h2>Objectifs</h2><div class="stack">${OBJECTIVES.map(o => {
    const r = objectiveResults(o); const got = r.filter(x => x.v !== ''); const first = got[0], last = got[got.length - 1];
    const delta = got.length > 1 ? last.v - first.v : null;
    return `<div class="card stack"><div class="row"><strong class="grow">${esc(o.label)}</strong>${delta !== null ? `<span class="pill">${delta >= 0 ? '+' : ''}${delta} depuis le cycle ${first.n}</span>` : ''}</div>
      <div class="obj-grid">${r.map(x => `<div><span class="faint small">Cycle ${x.n}</span><strong class="num">${x.v === '' ? '—' : x.v}</strong></div>`).join('')}</div>
      ${sparkline(got.map(x => x.v))}
      <p class="small muted" style="margin:0">${esc(o.how)}</p></div>`; }).join('')}</div>`;
}
function sparkline(vals) {
  if (vals.length < 2) return '';
  const W = 300, H = 42, pad = 5; const mn = Math.min(...vals), mx = Math.max(...vals); const span = mx - mn || 1;
  const pts = vals.map((v, i) => [pad + i * (W - 2 * pad) / (vals.length - 1), H - pad - (v - mn) / span * (H - 2 * pad)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="${d} L${last[0]} ${H} L${pts[0][0]} ${H} Z"/><path class="l" d="${d}"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5"/></svg>`;
}
function viewBenchmarks() {

}
function viewProgression() {

function importData(text) {
  let d; try { d = JSON.parse(text); } catch (e) { showToast('Fichier illisible : ce n’est pas du JSON valide.'); return; }
  const ask = (kind, data, summary) => { UI.pendingImport = { kind, data, summary }; UI.sheet = 'confirm:import'; renderSheet(); };
  if (!isAdmin() && d && (d.fileType === 'onair.bibliotheque' || d.fileType === 'onair.sauvegarde' || (d.fileType === 'onair.carnet' && Array.isArray(d.sessions)))) { showToast('Seul un administrateur peut remplacer la bibliothèque ou le carnet.'); return; }
  if (d && d.fileType === 'onair.sauvegarde') {
    const st = progressionToState(d.progression), eb = checkBib(d.bibliotheque), ec = !eb && checkCar(d.carnet, d.bibliotheque);
    if (!st || eb || ec) { showToast('Export complet incomplet : ' + (eb || ec || 'progression illisible')); return; }
    return ask('all', d, 'la bibliothèque, le carnet et ta progression');
  }
  if (d && d.fileType === 'onair.bibliotheque') { const e = checkBib(d); if (e) { showToast('Bibliothèque refusée : ' + e); return; } return ask('bib', d, 'la bibliothèque de mouvements'); }
  if (d && d.fileType === 'onair.carnet' && Array.isArray(d.sessions)) { const e = checkCar(d, BIB); if (e) { showToast('Carnet refusé : ' + e); return; } return ask('car', d, 'le carnet de séances'); }
  if (d && (d.fileType === 'onair.progression' || isLegacyProgression(d))) { const st = progressionToState(d); if (!st) { showToast('Progression illisible'); return; } return ask('progression', st, 'ta progression'); }
  if (d && d.fileType === 'hybrid.movements' && Array.isArray(d.movements)) {
    let n = 0; d.movements.forEach(m => { if (MOVE_BY_ID[m.id] && PREF_LABELS[m.selection || m.preference]) { S.prefs[m.id] = m.selection || m.preference; n++; } });
    touchMeta(); render(); showToast(`Préférences importées pour ${n} mouvements`); return;
  }

}
function confirmImport() {
